<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Voice Sales Bot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4 md:p-6">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-cyan-400">AI Voice Sales Bot</h1>
      <div class="flex gap-2">
        <button id="settingsBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm">⚙️ Settings</button>
        <button id="historyTabBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm">📜 History</button>
      </div>
    </header>

    <div id="consentBanner" class="hidden mb-4 p-3 rounded-xl bg-amber-900/40 border border-amber-700 text-amber-200 text-sm">
      <p class="font-semibold mb-1">Recording Consent</p>
      <p class="mb-2">This call may be recorded for quality purposes. By starting you consent to audio recording and transcription.</p>
      <label class="flex items-center gap-2"><input type="checkbox" id="consentCheck" class="accent-cyan-500" /> I consent</label>
      <button id="consentAccept" class="mt-2 px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-sm font-semibold">Accept</button>
    </div>

    <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <div>
          <div class="text-xs uppercase text-slate-500">Status</div>
          <div id="callStatus" class="font-semibold text-slate-300">Idle</div>
        </div>
        <div class="text-right">
          <div class="text-xs uppercase text-slate-500">Duration</div>
          <div id="callTimer" class="text-xl font-mono text-cyan-400">00:00</div>
        </div>
      </div>
      <div class="flex gap-2 mb-3">
        <button id="startCallBtn" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm">📞 Start</button>
        <button id="endCallBtn" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 font-semibold text-sm" disabled>⏹ End</button>
        <button id="muteBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm" disabled>🎤 Mute</button>
      </div>
      <div id="productCard" class="rounded-xl bg-slate-800/60 border border-slate-700 p-3 mb-3">
        <div class="text-xs uppercase text-slate-500 mb-1">Selling</div>
        <div id="productName" class="font-bold text-cyan-300"></div>
        <div id="productDesc" class="text-sm text-slate-300 mt-1"></div>
        <div id="productPrice" class="text-sm text-emerald-400 mt-1 font-semibold"></div>
      </div>
      <div class="rounded-xl bg-slate-950 border border-slate-800 overflow-hidden">
        <div class="px-3 py-2 border-b border-slate-800 text-xs font-semibold text-slate-400">Live Conversation</div>
        <div id="chatLog" class="h-64 overflow-y-auto p-3 space-y-2"></div>
        <div id="interimLine" class="px-3 pb-2 text-xs italic text-slate-500"></div>
      </div>
    </div>

    <section id="historyView" class="hidden">
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold">Call History</h2>
          <button id="clearHistoryBtn" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs border border-slate-700">Clear All</button>
        </div>
        <div id="historyList" class="space-y-3"></div>
      </div>
    </section>
  </div>

  <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold">Settings</h2>
        <button id="closeSettings" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3">
        <div><label class="block text-sm font-semibold mb-1">Product Name</label><input id="sProductName" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-semibold mb-1">Description</label><textarea id="sProductDesc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2"></textarea></div>
        <div><label class="block text-sm font-semibold mb-1">Pricing</label><input id="sProductPrice" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-semibold mb-1">Language</label>
          <select id="sLanguage" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
            <option value="en-US">English</option>
            <option value="hi-IN">Hindi</option>
            <option value="te-IN">Telugu</option>
          </select>
        </div>
        <div><label class="block text-sm font-semibold mb-1">Voice</label><select id="sVoice" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2"></select></div>
        <div><label class="block text-sm font-semibold mb-1">LLM Endpoint</label><input id="sLlmEndpoint" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-semibold mb-1">LLM Model</label><input id="sLlmModel" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-semibold mb-1">API Key (optional)</label><input id="sApiKey" type="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" /></div>
        <button id="saveSettings" class="w-full px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 font-semibold">Save</button>
      </div>
    </div>
  </div>

  <div id="summaryModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-5">
      <h2 class="font-bold mb-3">Call Summary</h2>
      <div id="summaryContent"></div>
      <button id="closeSummary" class="mt-3 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
